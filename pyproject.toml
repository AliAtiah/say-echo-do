[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "say-echo-do"
version = "0.1.0"
description = "Strategic speech, media echo, and the economics of false alarms: theory and tools for inverting institutional and media sentiment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Atiah Alzahrani" }]
keywords = ["quantitative finance", "sentiment analysis", "hawkes processes", "contrastive learning",
            "path signatures", "market microstructure", "strategic communication"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
